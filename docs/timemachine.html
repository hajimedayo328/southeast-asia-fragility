<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通貨危機タイムマシン 1978–2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:#0e1219;color:#dfe6ee;padding:18px 22px 60px}
h1{font-size:1.5rem;margin-bottom:2px}
.sub{color:#8ea0b5;font-size:.85rem;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
button{background:#1c2733;color:#dfe6ee;border:1px solid #33475c;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.9rem}
button:hover{background:#26364a}
button.on{background:#d64545;border-color:#d64545;color:#fff}
#month{font-size:1.7rem;font-weight:800;min-width:7.2rem;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:220px;accent-color:#d64545}
.eps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.eps button{font-size:.78rem;padding:4px 9px;border-radius:999px}
.gauge{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:.85rem;color:#8ea0b5}
.gtrack{width:260px;height:12px;background:linear-gradient(90deg,#3b7dd8,#5c6b7a,#d64545);border-radius:6px;position:relative}
.gdot{position:absolute;top:-4px;width:6px;height:20px;background:#fff;border-radius:3px;transform:translateX(-3px)}
#world{position:relative}
.region{margin-bottom:10px}
.rtitle{font-size:.78rem;color:#8ea0b5;margin:6px 0 4px}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{width:46px;height:34px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#fff;cursor:default;position:relative;transition:background .15s}
.tile small{font-weight:400;font-size:.56rem;opacity:.8}
.tile.onset-soon{outline:2px solid #fff;outline-offset:1px}
.tile.onset-now::after{content:"⚡";position:absolute;top:-9px;right:-5px;font-size:.9rem}
@keyframes burn{0%,100%{box-shadow:0 0 4px 1px #ff5a3c}50%{box-shadow:0 0 12px 4px #ff5a3c}}
.tile.burning{animation:burn 1.1s infinite}
#arcs{position:absolute;inset:0;pointer-events:none;overflow:visible}
#tip{position:fixed;background:#1c2733;border:1px solid #33475c;border-radius:8px;padding:8px 12px;font-size:.8rem;pointer-events:none;display:none;z-index:9;max-width:260px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;font-size:.78rem;color:#8ea0b5;align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-2px}
.note{font-size:.78rem;color:#7d8fa3;line-height:1.7;border-top:1px solid #24303d;padding-top:12px;margin-top:18px;max-width:70em}
a{color:#7fb0e8}
@keyframes dash{to{stroke-dashoffset:-14}}
#arcs line{stroke:#ff7a3c;stroke-width:1.6;stroke-dasharray:7 7;animation:dash .7s linear infinite;opacity:.85}
</style></head><body>
<h1>通貨危機タイムマシン <span style="color:#8ea0b5;font-weight:400">1978–2026</span></h1>
<p class="sub">各月、画面の中の警報は「その月までのデータ」しか知らない。赤=警報上位、🔥=危機進行中、オレンジの点線=貿易の線を伝う火。<b>スペース</b>で再生、<b>←→</b>で1ヶ月ずつ。</p>
<div class="bar">
  <button id="play">▶ 再生</button>
  <select id="spd"><option value="220">ゆっくり</option><option value="110" selected>普通</option><option value="45">速い</option></select>
  <div id="month">1978-01</div>
  <input type="range" id="slider" min="0" value="0">
  <button id="ans">答え合わせ: OFF</button>
</div>
<div class="eps" id="eps"></div>
<div class="gauge">世界の嵐ゲージ(ドル・米金利・資源・恐怖):<div class="gtrack"><div class="gdot" id="gdot"></div></div><span id="gval"></span></div>
<div id="world"><svg id="arcs"></svg></div>
<div class="legend">
  <span><span class="sw" style="background:#d64545"></span>警報 上位10%</span>
  <span><span class="sw" style="background:#e0862f"></span>10-20%</span>
  <span><span class="sw" style="background:#b7952f"></span>20-30%</span>
  <span><span class="sw" style="background:#3d4c5c"></span>それ以下(安全側)</span>
  <span><span class="sw" style="background:#7a1f12"></span>🔥 危機進行中</span>
  <span><span class="sw" style="background:#2a3340"></span>データ不足で採点不能</span>
  <span>⚡=この月に危機入り ／ 白枠=6ヶ月以内に危機入り(答え合わせON時)</span>
</div>
<p class="note" id="note"></p>
<p class="note">この画面は研究の実験結果を1つの装置に束ねたもの。詳細: <a href="index.html">研究本編</a> ／ 生の計算記録: <a href="data/verified_results.txt">verified_results.txt</a></p>
<div id="tip"></div>
<script>
const REGJP = {"Latin America & Caribbean":"中南米・カリブ","Sub-Saharan Africa":"サブサハラ・アフリカ","Europe & Central Asia":"欧州・中央アジア","Middle East, North Africa, Afghanistan & Pakistan":"中東・北アフリカ","Middle East & North Africa":"中東・北アフリカ","East Asia & Pacific":"東アジア・太平洋","South Asia":"南アジア","North America":"北米"};
const EPISODES = [["1982-08","中南米債務危機"],["1994-12","テキーラ危機"],["1997-07","アジア危機"],["1998-08","ロシア危機"],["2008-10","世界金融危機"],["2015-01","資源安・人民元"],["2018-08","トルコショック"],["2022-05","スリランカ"],["latest","現在"]];
let D=null,t=0,timer=null,answer=false;
const el=id=>document.getElementById(id);
fetch('data/timemachine.json').then(r=>r.json()).then(d=>{D=d;init();});
function color(ch){
  if(ch==='.')return'#2a3340';
  if(ch==='X')return'#7a1f12';
  const k=+ch;
  return k===0?'#d64545':k===1?'#e0862f':k===2?'#b7952f':'#3d4c5c';
}
function init(){
  el('slider').max=D.months.length-1;
  const regs={};
  D.isos.forEach((c,ix)=>{const r=D.region[c]||'?';(regs[r]=regs[r]||[]).push(c);});
  const world=el('world');
  Object.keys(regs).sort().forEach(r=>{
    if(r==='?'||r==='Aggregates')return;
    const div=document.createElement('div');div.className='region';
    div.innerHTML=`<div class="rtitle">${REGJP[r]||r}</div>`;
    const tl=document.createElement('div');tl.className='tiles';
    regs[r].sort().forEach(c=>{
      const d=document.createElement('div');d.className='tile';d.id='t_'+c;
      d.innerHTML=`${c}<small>${(D.jp[c]||D.names[c]||'').slice(0,6)}</small>`;
      d.onmousemove=e=>tip(e,c);d.onmouseleave=()=>el('tip').style.display='none';
      tl.appendChild(d);
    });
    div.appendChild(tl);world.appendChild(div);
  });
  EPISODES.forEach(([m,nm])=>{
    const b=document.createElement('button');b.textContent=nm;
    b.onclick=()=>{go(m==='latest'?D.months.length-1:D.months.indexOf(m));};
    el('eps').appendChild(b);
  });
  el('note').textContent=D.note;
  el('slider').oninput=e=>go(+e.target.value);
  el('play').onclick=toggle;
  el('ans').onclick=()=>{answer=!answer;el('ans').textContent='答え合わせ: '+(answer?'ON':'OFF');el('ans').classList.toggle('on',answer);render();};
  document.onkeydown=e=>{
    if(e.key===' '){e.preventDefault();toggle();}
    if(e.key==='ArrowRight')go(t+1);
    if(e.key==='ArrowLeft')go(t-1);
  };
  onresize=()=>render();
  go(D.months.indexOf('1997-01')>=0?D.months.indexOf('1997-01'):0);
}
function toggle(){
  if(timer){clearInterval(timer);timer=null;el('play').textContent='▶ 再生';}
  else{timer=setInterval(()=>{if(t>=D.months.length-1)toggle();else go(t+1);},+el('spd').value);el('play').textContent='⏸ 停止';}
}
function go(k){t=Math.max(0,Math.min(D.months.length-1,k));el('slider').value=t;render();}
function onsetIdx(c){return(D.onsets[c]||[]).map(m=>D.months.indexOf(m));}
function render(){
  const mo=D.months[t];el('month').textContent=mo;
  const st=D.states[t];
  const g=D.gsi[t];
  el('gdot').style.left=g==null?'50%':`${Math.max(2,Math.min(98,50+g*24))}%`;
  el('gval').textContent=g==null?'—':(g>=0.5?'嵐':g<=-0.5?'凪':'中立')+` (${g>0?'+':''}${g})`;
  D.isos.forEach((c,ix)=>{
    const d=el('t_'+c);if(!d)return;
    const ch=st[ix];
    d.style.background=color(ch);
    d.style.opacity=ch==='.'?0.55:1;
    d.classList.toggle('burning',ch==='X');
    const oi=onsetIdx(c);
    d.classList.toggle('onset-now',oi.includes(t));
    d.classList.toggle('onset-soon',answer&&oi.some(x=>x>t&&x<=t+6));
  });
  // 火の弧: 上位10%の国 ← 燃えている主要相手
  const svg=el('arcs');svg.innerHTML='';
  const wr=el('world').getBoundingClientRect();
  svg.setAttribute('width',wr.width);svg.setAttribute('height',wr.height);
  (D.top[mo]||[]).forEach(([c,gg,tf,bp])=>{
    if(!bp||tf<=0)return;
    const a=el('t_'+bp),b=el('t_'+c);if(!a||!b)return;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',ra.left-wr.left+ra.width/2);l.setAttribute('y1',ra.top-wr.top+ra.height/2);
    l.setAttribute('x2',rb.left-wr.left+rb.width/2);l.setAttribute('y2',rb.top-wr.top+rb.height/2);
    svg.appendChild(l);
  });
}
function tip(e,c){
  const mo=D.months[t];const info=(D.top[mo]||[]).find(x=>x[0]===c);
  const ix=D.isos.indexOf(c);const ch=D.states[t][ix];
  let s=`<b>${D.jp[c]||D.names[c]}</b> (${c})<br>`;
  if(ch==='.')s+='この月はデータ不足で採点できない';
  else if(ch==='X')s+='🔥 危機進行中(通貨暴落の最中)';
  else s+=`警報順位: 上位${(+ch)*10}〜${(+ch)*10+10}%帯`;
  if(info)s+=`<br>借金÷貯金=${info[1]} ／ 貿易火事=${info[2]}%`+(info[3]?`<br>主な火元: ${D.jp[info[3]]||D.names[info[3]]||info[3]}`:'');
  const oi=onsetIdx(c);
  if(answer&&oi.some(x=>x>t&&x<=t+6))s+='<br>⚠ この後6ヶ月以内に危機入り';
  const tp=el('tip');tp.innerHTML=s;tp.style.display='block';
  tp.style.left=Math.min(innerWidth-280,e.clientX+14)+'px';tp.style.top=(e.clientY+14)+'px';
}
</script></body></html>
